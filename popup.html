<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>GeekNews Theme</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      width: 220px;
      margin: 0;
      padding: 14px 16px;
      font-size: 14px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 0;
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    button.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 14px 0;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 8px;
      color: #555;
    }
    #resetVisited {
      width: 100%;
      padding: 8px 0;
      border: 1px solid #d0d0d0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    #resetVisited:active {
      background: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>테마 선택</h1>
  <div class="row">
    <button id="light">라이트</button>
    <button id="dark">다크</button>
  </div>
  <hr />
  <h2>방문 기록</h2>
  <button id="resetVisited">방문 기록 초기화</button>
  <script src="popup.js"></script>
</body>
</html>
